name: Golden Solution Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prevalidate:
    if: github.head_ref == 'golden-solution' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
